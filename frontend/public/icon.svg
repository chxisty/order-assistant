<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark Navy Card Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1428"/>
      <stop offset="100%" stop-color="#080D1B"/>
    </linearGradient>

    <!-- Electric Blue to Cyan Shopping Bag Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glowing Cyan Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Shopping Bag Handle -->
  <path d="M24 24 V17 C24 12.5 27.5 9 32 9 C36.5 9 40 12.5 40 17 V24" 
        fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round"/>

  <!-- Shopping Bag Body -->
  <rect x="14" y="22" width="36" height="34" rx="7" fill="url(#bagGrad)"/>

  <!-- Inner Fold Contour Line -->
  <path d="M14 29 L32 34 L50 29" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>

  <!-- Central AI Spark (4-Point Star) -->
  <path d="M32 34 C32 39 33.5 42 38.5 42 C33.5 42 32 45 32 50 C32 45 30.5 42 25.5 42 C30.5 42 32 39 32 34 Z" 
        fill="url(#sparkGrad)" filter="url(#glow)"/>

  <!-- Accent Sparkle (Top Right) -->
  <path d="M43 25 C43 26.8 43.7 27.8 45.5 27.8 C43.7 27.8 43 28.8 43 30.6 C43 28.8 42.3 27.8 40.5 27.8 C42.3 27.8 43 26.8 43 25 Z" 
        fill="#FFFFFF"/>
</svg>
